name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kwin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - name: Install KWin dependencies
        run: devenv shell --impure -- npm ci --prefix kwin
      - name: Build Rust Planner fixture for KWin tests
        run: devenv shell --impure -- cargo build --locked -p tiler-protocol --example planner_eval
      - name: KWin tests
        run: devenv shell --impure -- npm test --prefix kwin
      - name: KWin typecheck
        run: devenv shell --impure -- npm run typecheck --prefix kwin

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - name: Rust workspace tests
        run: devenv shell --impure -- cargo test --workspace
      - name: Rust format
        run: devenv shell --impure -- cargo fmt --all -- --check
      - name: Rust strict Clippy
        run: devenv shell --impure -- cargo clippy --workspace --all-targets -- -D warnings

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      - name: Install KWin dependencies for shell fixtures
        run: devenv shell --impure -- npm ci --prefix kwin
      - name: Build KWin fixture bundle
        run: devenv shell --impure -- npm run build --prefix kwin
      - name: Build tray fixture binary
        run: devenv shell --impure -- just build-rust
      - name: Headless shell suites
        run: |
          devenv shell --impure -- bash -euo pipefail -c '
            log="$(mktemp)"
            for suite in scripts/*.test.sh; do
              if ! TRAY_05B_BINARY="$PWD/target/debug/plasma-auto-tiler" bash "$suite" 2>&1 | tee "$log"; then
                echo "::error::${suite} failed"
                while IFS= read -r line; do
                  echo "::error::${line//%/%25}"
                done < <(tail -n 40 "$log")
                rm -f -- "$log"
                exit 1
              fi
            done
            rm -f -- "$log"
          '

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Build portable crates
        run: cargo +stable build --locked -p tiler-core -p tiler-protocol -p tiler-kwin-effect-ffi -p tiler-windows
      - name: Test portable crates
        run: cargo +stable test --locked -p tiler-core -p tiler-protocol -p tiler-kwin-effect-ffi -p tiler-windows
      - name: Rust format
        run: cargo +stable fmt --all -- --check
      - name: Rust strict Clippy
        run: cargo +stable clippy --locked -p tiler-core -p tiler-protocol -p tiler-kwin-effect-ffi -p tiler-windows --all-targets -- -D warnings
      - name: Check for whitespace errors
        run: git diff --check
