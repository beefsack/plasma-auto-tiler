[package]
name = "plasma-auto-tiler"
version = "0.1.0"
edition = "2024"

[dependencies]
async-lock = "3"
memmap2 = "0.9"
rustix = { version = "1", features = ["fs", "process", "runtime", "mm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wayland-client = { version = "0.31", default-features = false }
wayland-protocols = { version = "0.32", default-features = false, features = ["client"] }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
